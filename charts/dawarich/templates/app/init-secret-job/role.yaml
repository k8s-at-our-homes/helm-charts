apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "common.fullname" . }}-init-secret-job
  labels:
    {{- include "dawarich.secretInit.objectLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-secret" (include "common.fullname" .) | quote }}]
    verbs: ["get", "patch"]
