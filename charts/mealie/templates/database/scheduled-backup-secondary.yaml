{{- if and .Values.database.backups.enabled .Values.database.backups.secondary.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.database.clusterName }}-secondary
  labels:
    {{- include "mealie.database.objectLabels" . | nindent 4 }}
spec:
  cluster:
    name: {{ .Values.database.clusterName }}
  schedule: {{ .Values.database.backups.secondary.schedule | quote }}
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: {{ .Values.database.clusterName }}-secondary-backup-store
{{- end }}